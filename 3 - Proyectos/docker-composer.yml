version: '3'

services:
  openldap:
    image: osixia/openldap
    container_name: openldap
    restart: always   # Se reiniciará automáticamente con el sistema
    networks:
      - ldap_network
    ports:
      - "389:389"
      - "636:636"
    environment:
      LDAP_ORGANISATION: "Grupo6"
      LDAP_DOMAIN: "ficct.edu"
      LDAP_ADMIN_PASSWORD: "123ppp+++"
      LDAP_BACKEND: "mdb"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ldap_logs:/var/log/ldap

  phpldapadmin:
    image: osixia/phpldapadmin
    container_name: phpldapadmin
    restart: always   # Se reiniciará automáticamente con el sistema
    networks:
      - ldap_network
    ports:
      - "8080:80"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    depends_on:
      - openldap

volumes:
  ldap_data:
  ldap_config:
  ldap_logs:

networks:
  ldap_network:
    driver: bridge
